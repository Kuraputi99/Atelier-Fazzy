# サイトを組み立てて GitHub Pages に公開する
# ・main に push した時
# ・毎日1回(YouTube の新着動画とダウンロード数を取り直すため)
# ・Actions 画面の「Run workflow」ボタンを押した時
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 21 * * *'   # 毎日 6:17(日本時間)。UTC で書くので -9時間
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 公開が重ならないようにする
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Build site
        run: node scripts/build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # ダウンロード数の取得に使う(自動で用意される)
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
