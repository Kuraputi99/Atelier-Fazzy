<!DOCTYPE html>
<html lang="ja" data-lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Fazzy | About</title>

  <link rel="stylesheet" href="CSS/style.css">

  <!-- SNSで共有された時のカード表示(OGP)。URLの先頭部分は build.js が site.config.json の値に置き換える -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Atelier Fazzy">
  <meta property="og:title" content="Atelier Fazzy | About">
  <meta property="og:description" content="Kuraputi と Towaly の2人で、ゲーム・ツール・統合版Minecraftのアドオンを制作・配布しているオンライングループです。">
  <meta property="og:url" content="{{SITE_URL}}about.html">
  <meta property="og:image" content="{{SITE_URL}}Images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
</head>

<body data-root="">
  <div class="frame">

    <!-- ヘッダー部分 -->
    <header class="site-header">
      <a href="index.html" class="logo">ATELIER FAZZY</a>
      <button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-menu">
        <span></span><span></span><span></span>
      </button>
      <div class="site-menu" id="site-menu">
        <nav class="nav">
          <a href="index.html">HOME</a>
          <a href="about.html" class="nav-active">ABOUT</a>
          <a href="works.html">WORKS</a>
        </nav>
        <div class="lang-toggle">
          <button class="lang-btn" data-lang="en">ENGLISH</button>
          <button class="lang-btn is-active" data-lang="ja">日本語</button>
        </div>
      </div>
    </header>

    <!-- メイン セクション -->
    <section class="page-heading">
      <h1>&gt; ABOUT</h1>
      <p data-i18n="about.page.sub">about.page.sub</p>
    </section>

    <!-- ボディ セクション -->
    <section class="about-body">
      <p data-i18n="about.p1">about.p1</p>
      <p data-i18n="about.p2">about.p2</p>
      <p data-i18n="about.p3">about.p3</p>

      <!-- プロフ部分(Kuraputi) -->
      <div class="profile-list">
        <div class="profile-card">
          <img src="Images/Kuraputi.jpg" alt="Kuraputi" class="profile-img">
          <div class="profile-info">
            <h2 class="profile-name">Kuraputi</h2>
            <p data-i18n="about.kuraputi.bio">about.kuraputi.bio</p>
            <div class="profile-btns">
              <a href="https://youtube.com/@kuraputi?si=IuIl0CshdO0MC-f7" class="btn-small" target="_blank" rel="noopener">YouTube</a>
              <a href="https://x.com/kuraputi_ch9" class="btn-small" target="_blank" rel="noopener">X</a>
              <a href="https://github.com/Kuraputi99" class="btn-small" target="_blank" rel="noopener">GitHub</a>
            </div>
          </div>
        </div>

        <!-- プロフ部分(Towaly) -->
        <div class="profile-card">
          <img src="Images/Towaly.png" alt="Towaly" class="profile-img">
          <div class="profile-info">
            <h2 class="profile-name">Towaly</h2>
            <p data-i18n="about.towaly.bio">about.towaly.bio</p>
          </div>
        </div>
      </div>
    </section>

    <!-- フッター部分 -->
    <footer class="site-footer">
      <a href="terms.html" class="footer-link" data-i18n="footer.terms">footer.terms</a>
      <span>(C) 2026 ATELIER FAZZY</span>
    </footer>

  </div>

  <!-- スクリプト読み込み(common.js を最初に) -->
  <script src="JavaScript/common.js"></script>
  <script src="JavaScript/lang.js"></script>
  <script src="JavaScript/menu.js"></script>
  <script src="JavaScript/like.js"></script>
