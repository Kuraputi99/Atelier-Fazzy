<!DOCTYPE html>
<html lang="ja" data-lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atelier Fazzy | Works</title>
  <meta name="description" content="Kuraputi と Towaly の2人で、ゲーム・ツール・統合版Minecraftのアドオンを制作・配布しているオンライングループです。">
  <link rel="icon" type="image/png" href="Images/favicon.png">
  <link rel="apple-touch-icon" href="Images/apple-touch-icon.png">
  <link rel="stylesheet" href="CSS/style.css">

  <!-- SNSで共有された時のカード表示(OGP)。URLの先頭部分は build.js が site.config.json の値に置き換える -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Atelier Fazzy">
  <meta property="og:title" content="Atelier Fazzy | Works">
  <meta property="og:description" content="Kuraputi と Towaly の2人で、ゲーム・ツール・統合版Minecraftのアドオンを制作・配布しているオンライングループです。">
  <meta property="og:url" content="{{SITE_URL}}works.html">
  <meta property="og:image" content="{{SITE_URL}}Images/ogp.png">
  <meta name="twitter:card" content="summary_large_image">
</head>

<body data-root="">
  <div class="frame">

    <!-- ヘッダー部分 -->
    <header class="site-header">
      <a href="index.html" class="logo">ATELIER FAZZY</a>
      <button class="menu-btn" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="site-menu">
        <span></span><span></span><span></span>
      </button>
      <div class="site-menu" id="site-menu">
        <nav class="nav">
          <a href="index.html">HOME</a>
          <a href="about.html">ABOUT</a>
          <a href="works.html" class="nav-active">WORKS</a>
        </nav>
        <div class="lang-toggle">
          <button class="lang-btn" data-lang="en">ENGLISH</button>
          <button class="lang-btn is-active" data-lang="ja">日本語</button>
        </div>
      </div>
    </header>

    <!-- メイン セクション -->
    <section class="page-heading">
      <h1>&gt; WORKS</h1>
      <p data-i18n="works.page.sub">works.page.sub</p>
    </section>

    <!-- フィルター部分 -->
    <div class="filter-bar" role="group" aria-label="Filter works by category">
      <button class="filter-btn is-active" data-filter="all">ALL</button>
      <button class="filter-btn" data-filter="addon">ADDON</button>
      <button class="filter-btn" data-filter="tool">TOOL</button>
      <button class="filter-btn" data-filter="game">GAME</button>
    </div>

    <!-- 作品カード(works_render.js が作品を追加) -->
    <section class="works-grid" id="all-works"></section>

    <!-- 絞り込みで作品が0件の時のテキスト -->
    <p class="no-results" id="no-results" hidden data-i18n="works.noresults">works.noresults</p>

    <!-- フッター部分 -->
    <footer class="site-footer">
      <a href="terms.html" class="footer-link" data-i18n="footer.terms">footer.terms</a>
      <span>(C) 2026 ATELIER FAZZY</span>
    </footer>

  </div>

  <!-- スクリプト読み込み(common.js を最初に) -->
  <script src="JavaScript/common.js"></script>
  <script src="JavaScript/lang.js"></script>
  <script src="JavaScript/menu.js"></script>
  <script src="JavaScript/like.js"></script>
  <script src="JavaScript/works_render.js"></script>
</body>

</html>
